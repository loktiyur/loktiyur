name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: loktiyur
          filename: assets/metrics.svg
          committer_message: "chore: update metrics [skip ci]"
          config_timezone: Europe/Prague
          base: header
          plugin_languages: yes
          plugin_languages_ignored: jupyter notebook, powershell, cmake
          plugin_languages_details: percentage
          plugin_languages_limit: 5
          plugin_repositories: yes
          plugin_repositories_featured: ExpenseTracker, time-management-algorithms
